<!DOCTYPE html>
<html lang="en">

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
            background-image: radial-gradient(circle at 20% 30%, rgba(255, 215, 0, 0.03) 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, rgba(255, 215, 0, 0.03) 0%, transparent 50%);
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        /* ===== PASSWORD SCREEN ===== */
        .password-screen {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 32px;
            padding: 3.5rem 2.5rem;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
        }

        .password-screen .logo {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -2px;
            color: #ffffff;
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.1);
            margin-bottom: 0.3rem;
        }

        .password-screen .logo span {
            color: #00ff15;
        }

        .password-screen .subtitle {
            color: rgba(255, 255, 255, 0.25);
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
        }

        .password-screen .lock-icon {
            font-size: 2.5rem;
            color: rgba(255, 215, 0, 0.15);
            margin-bottom: 1.5rem;
        }

        .password-screen input {
            width: 100%;
            max-width: 320px;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 2px;
        }

        .password-screen input:focus {
            border-color: rgba(255, 215, 0, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .password-screen input::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        .password-screen .btn {
            margin-top: 1.2rem;
            padding: 1rem 3rem;
            background: #00ff26;
            color: #0a0a0a;
            border: none;
            border-radius: 60px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .password-screen .btn:hover {
            background: #00ff1a;
            transform: scale(1.02);
        }

        .password-screen .error-msg {
            color: #00ff11;
            font-size: 0.85rem;
            margin-top: 1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .password-screen .error-msg.show {
            opacity: 1;
        }

        /* ===== DASHBOARD ===== */
        .dashboard {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Top Bar */
        .top-bar {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 32px;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .top-bar .brand {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -1px;
        }

        .top-bar .brand span {
            color: #18f000;
        }

        .top-bar .status {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.75rem;
            letter-spacing: 1px;
            padding: 0.4rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
        }

        .top-bar .status i {
            color: #4ade80;
            font-size: 0.5rem;
            margin-right: 6px;
        }

        /* Game Selector */
        .game-selector {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 32px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .game-selector .label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 1rem;
            display: block;
        }

        .game-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .game-btn {
            padding: 0.8rem 2.5rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .game-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .game-btn.active {
            background: #0dff00;
            color: #0a0a0a;
            border-color: #0dff00;
        }

        /* Key Display */
        .key-display {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 32px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .key-display .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .key-display .header .title {
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 700;
        }

        .key-display .header .title span {
            color: rgba(255, 255, 255, 0.3);
            font-weight: 400;
            font-size: 0.85rem;
        }

        .key-display .header .actions {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-btn.danger {
            background: rgba(255, 0, 0, 0.15);
            color: #00ff48;
            border: 1px solid rgba(255, 0, 0, 0.1);
        }

        .action-btn.danger:hover {
            background: rgba(255, 0, 0, 0.25);
        }

        .action-btn.danger:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .action-btn.primary {
            background: rgba(255, 215, 0, 0.15);
            color: #0dff00;
            border: 1px solid rgba(255, 215, 0, 0.1);
        }

        .action-btn.primary:hover {
            background: rgba(255, 215, 0, 0.25);
        }

        /* Key Sections */
        .key-sections {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1.2rem;
        }

        @media (max-width: 900px) {
            .key-sections {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {
            .key-sections {
                grid-template-columns: 1fr;
            }
            .password-screen .logo {
                font-size: 2.5rem;
            }
            .top-bar .brand {
                font-size: 1.4rem;
            }
        }

        .key-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 1.2rem;
        }

        .key-section .section-label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .key-section .section-label .count {
            color: rgba(255, 255, 255, 0.15);
            font-size: 0.6rem;
        }

        .key-section .key-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            max-height: 200px;
            overflow-y: auto;
            padding: 0.2rem;
        }

        .key-section .key-list::-webkit-scrollbar {
            width: 3px;
        }

        .key-section .key-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
        }

        .key-section .key-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
        }

        .key-item {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            padding: 0.2rem 0.7rem;
            border-radius: 60px;
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            white-space: nowrap;
        }

        .key-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .key-item.selected {
            background: rgba(255, 215, 0, 0.15);
            border-color: #0dff00;
            color: #0dff00;
        }

        .key-item.lifetime {
            border-color: rgba(255, 215, 0, 0.15);
            color: rgba(255, 215, 0, 0.6);
        }

        .key-item.lifetime.selected {
            background: rgba(255, 215, 0, 0.2);
            border-color: #0dff00;
            color: #0dff00;
        }

        .empty-state {
            color: rgba(255, 255, 255, 0.1);
            font-size: 0.75rem;
            text-align: center;
            padding: 1rem;
            width: 100%;
        }

        /* No game selected */
        .no-selection {
            color: rgba(255, 255, 255, 0.2);
            text-align: center;
            padding: 3rem 1rem;
            font-size: 0.9rem;
        }

        .no-selection i {
            font-size: 2rem;
            display: block;
            margin-bottom: 1rem;
            color: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

                        "RIVALS-30D-Q5R6S7T8", "RIVALS-30D-U9V0W1X2", "RIVALS-30D-Y3Z4A5B6",
                        "RIVALS-30D-C7D8E9F0", "RIVALS-30D-G1H2I3J4", "RIVALS-30D-K5L6M7N8",
                        "RIVALS-30D-O9P0Q1R2", "RIVALS-30D-S3T4U5V6", "RIVALS-30D-W7X8Y9Z0",
                        "RIVALS-30D-A1B2C3D4", "RIVALS-30D-E5F6G7H8", "RIVALS-30D-I9J0K1L2",
                        "RIVALS-30D-M3N4O5P6", "RIVALS-30D-Q7R8S9T0", "RIVALS-30D-U1V2W3X4",
                        "RIVALS-30D-Y5Z6A7B8", "RIVALS-30D-C9D0E1F2", "RIVALS-30D-G3H4I5J6",
                        "RIVALS-30D-K7L8M9N0", "RIVALS-30D-O1P2Q3R4", "RIVALS-30D-S5T6U7V8",
                        "RIVALS-30D-W9X0Y1Z2", "RIVALS-30D-A3B4C5D6", "RIVALS-30D-E7F8G9H0"
                    ],
                    'Lifetime': [
                        "RIVALS-LIFETIME-MASTER-001",
                        "RIVALS-LIFETIME-MASTER-002",
                        "RIVALS-LIFETIME-MASTER-003"
                    ]
                }
            }
        };

        // ============================================================
        // STATE
        // ============================================================
        let currentGame = null; // 'mm2' or 'rivals'
        let selectedKeys = new Set();

        // ============================================================
        // DOM REFS
        // ============================================================
        const passwordScreen = document.getElementById('passwordScreen');
        const dashboard = document.getElementById('dashboard');
        const passwordInput = document.getElementById('passwordInput');
        const unlockBtn = document.getElementById('unlockBtn');
        const errorMsg = document.getElementById('errorMsg');
        const gameButtons = document.querySelectorAll('.game-btn');
        const keyContent = document.getElementById('keyContent');
        const gameTitle = document.getElementById('gameTitle');
        const deleteBtn = document.getElementById('deleteSelectedBtn');
        const selectAllBtn = document.getElementById('selectAllBtn');

        // ============================================================
        // PASSWORD LOGIC
        // ============================================================
        function attemptUnlock() {
            const entered = passwordInput.value.trim();
            if (entered === MASTER_PASSWORD) {
                passwordScreen.style.display = 'none';
                dashboard.style.display = 'block';
                passwordInput.value = '';
            } else {
                errorMsg.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
                setTimeout(() => errorMsg.classList.remove('show'), 3000);
            }
        }

        unlockBtn.addEventListener('click', attemptUnlock);
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') attemptUnlock();
        });
        window.addEventListener('load', () => passwordInput.focus());

        // ============================================================
        // RENDER KEYS
        // ============================================================
        function renderKeys() {
            if (!currentGame) {
                keyContent.innerHTML = `
                    <div class="no-selection">
                        <i class="fas fa-arrow-up"></i>
                        Choose a game above to manage keys
                    </div>
                `;
                gameTitle.innerHTML = `Select a game <span>to view keys</span>`;
                deleteBtn.disabled = true;
                return;
            }

            const gameData = KEY_DATA[currentGame];
            gameTitle.innerHTML = `${gameData.label} <span>· key management</span>`;

            let html = '<div class="key-sections">';
            const sectionOrder = ['1-Day', '7-Day', '30-Day', 'Lifetime'];

            for (const sectionName of sectionOrder) {
                const keys = gameData.sections[sectionName] || [];
                const isLifetime = sectionName === 'Lifetime';
                html += `
                    <div class="key-section">
                        <div class="section-label">
                            ${sectionName}
                            <span class="count">${keys.length} keys</span>
                        </div>
                        <div class="key-list" data-section="${sectionName}">
                `;
                if (keys.length === 0) {
                    html += `<div class="empty-state">No keys available</div>`;
                } else {
                    for (const key of keys) {
                        const isSelected = selectedKeys.has(key);
                        html += `
                            <span class="key-item ${isLifetime ? 'lifetime' : ''} ${isSelected ? 'selected' : ''}" 
                                  data-key="${key}" 
                                  onclick="toggleKey('${key}')">
                                ${key}
                            </span>
                        `;
                    }
                }
                html += `</div></div>`;
            }

            html += '</div>';
            keyContent.innerHTML = html;
            updateDeleteBtn();
        }

        // ============================================================
        // KEY SELECTION
        // ============================================================
        function toggleKey(key) {
            if (selectedKeys.has(key)) {
                selectedKeys.delete(key);
            } else {
                selectedKeys.add(key);
            }
            renderKeys();
        }

        function selectAllKeys() {
            if (!currentGame) return;
            const gameData = KEY_DATA[currentGame];
            const allKeys = Object.values(gameData.sections).flat();
            for (const key of allKeys) {
                selectedKeys.add(key);
            }
            renderKeys();
        }

        function deleteSelectedKeys() {
            if (selectedKeys.size === 0 || !currentGame) return;
            if (!confirm(`Delete ${selectedKeys.size} selected key(s)? This cannot be undone.`)) return;

            const gameData = KEY_DATA[currentGame];
            for (const sectionName in gameData.sections) {
                gameData.sections[sectionName] = gameData.sections[sectionName].filter(
                    key => !selectedKeys.has(key)
                );
            }
            selectedKeys.clear();
            renderKeys();
        }

        function updateDeleteBtn() {
            deleteBtn.disabled = selectedKeys.size === 0;
            deleteBtn.textContent = `🗑️ Delete Selected (${selectedKeys.size})`;
        }

        // ============================================================
        // GAME SELECTION
        // ============================================================
        gameButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                const game = this.dataset.game;
                gameButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentGame = game;
                selectedKeys.clear();
                renderKeys();
            });
        });

        // ============================================================
        // BUTTON EVENTS
        // ============================================================
        selectAllBtn.addEventListener('click', selectAllKeys);
        deleteBtn.addEventListener('click', deleteSelectedKeys);

        // ============================================================
        // INIT
        // ============================================================
        renderKeys();

        // ============================================================
        // KEYBOARD SHORTCUTS
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'a') {
                e.preventDefault();
                if (dashboard.style.display === 'block') {
                    selectAllKeys();
                }
            }
            if (e.key === 'Delete' || e.key === 'Backspace') {
                if (selectedKeys.size > 0 && dashboard.style.display === 'block') {
                    deleteSelectedKeys();
                }
            }
        });

        console.log('=== AMIRI KEYS SYSTEM LOADED ===');
        console.log('Password:', MASTER_PASSWORD);
        console.log('Total MM2 Keys:', Object.values(KEY_DATA.mm2.sections).flat().length);
        console.log('Total RIVALS Keys:', Object.values(KEY_DATA.rivals.sections).flat().length);
    </script>

</body>
</html>
