<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BEAM BOT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: url('wallpaper 2.jfif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            position: relative;
        }

        /* Dark overlay for readability */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 900px;
            padding: 2rem;
        }

        /* ---- PASSWORD SCREEN ---- */
        .password-screen {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 32px;
            padding: 3.5rem 2.5rem;
            text-align: center;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
        }

        .password-screen .logo {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: -2px;
            color: #ffffff;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.1);
            margin-bottom: 0.5rem;
        }

        .password-screen .logo span {
            color: #888;
            font-weight: 300;
        }

        .password-screen .subtitle {
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.9rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 2.5rem;
        }

        .password-screen .lock-icon {
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.15);
            margin-bottom: 1.5rem;
        }

        .password-screen input {
            width: 100%;
            max-width: 320px;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 60px;
            color: white;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
            letter-spacing: 2px;
        }

        .password-screen input:focus {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        .password-screen input::placeholder {
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
        }

        .password-screen .btn {
            margin-top: 1.2rem;
            padding: 1rem 3rem;
            background: #ffffff;
            color: #0a0a0a;
            border: none;
            border-radius: 60px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }

        .password-screen .btn:hover {
            background: #e0e0e0;
            transform: scale(1.02);
        }

        .password-screen .error-msg {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .password-screen .error-msg.show {
            opacity: 1;
        }

        /* ---- MAIN DASHBOARD ---- */
        .dashboard {
            display: none;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 32px;
            padding: 2.5rem;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dashboard .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .dashboard .top-bar .brand {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -1px;
        }

        .dashboard .top-bar .brand span {
            color: #555;
            font-weight: 300;
        }

        .dashboard .top-bar .user-badge {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            letter-spacing: 1px;
            padding: 0.4rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 60px;
        }

        /* ---- KEY SECTIONS ---- */
        .keys-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 1.2rem;
            margin-bottom: 2.5rem;
        }

        @media (max-width: 768px) {
            .keys-grid {
                grid-template-columns: 1fr;
            }
        }

        .key-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }

        .key-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .key-card .label {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }

        .key-card .count {
            font-size: 3rem;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
        }

        .key-card .duration {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.75rem;
            margin-top: 0.3rem;
        }

        .key-card.lifetime .count {
            color: #ffd700;
        }

        /* ---- KEY LIST ---- */
        .key-list-section {
            margin-bottom: 2.5rem;
        }

        .key-list-section .section-title {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        .key-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.6rem;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            max-height: 180px;
            overflow-y: auto;
        }

        .key-list::-webkit-scrollbar {
            width: 4px;
        }

        .key-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 4px;
        }

        .key-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .key-tag {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0.3rem 1rem;
            border-radius: 60px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Courier New', monospace;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .key-tag.lifetime-key {
            border-color: rgba(255, 215, 0, 0.2);
            color: #ffd700;
            background: rgba(255, 215, 0, 0.05);
        }

        /* ---- TEXT BOX ---- */
        .input-section {
            margin-top: 1rem;
        }

        .input-section textarea {
            width: 100%;
            padding: 1.2rem 1.5rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            color: #ffffff;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            resize: vertical;
            min-height: 120px;
            transition: all 0.3s ease;
        }

        .input-section textarea:focus {
            border-color: rgba(255, 255, 255, 0.15);
            background: rgba(255, 255, 255, 0.06);
        }

        .input-section textarea::placeholder {
            color: rgba(255, 255, 255, 0.15);
        }

        .input-section .label {
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 0.6rem;
            display: block;
        }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 600px) {
            .password-screen {
                padding: 2rem 1.5rem;
            }
            .password-screen .logo {
                font-size: 2.5rem;
            }
            .dashboard {
                padding: 1.5rem;
            }
            .dashboard .top-bar .brand {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== PASSWORD SCREEN ===== -->
        <div class="password-screen" id="passwordScreen">
            <div class="lock-icon"><i class="fas fa-shield-halved"></i></div>
            <div class="logo">BEAM <span>BOT</span></div>
            <div class="subtitle">· secured access ·</div>
            <input type="password" id="passwordInput" placeholder="Enter password" autofocus />
            <br />
            <button class="btn" id="unlockBtn"><i class="fas fa-arrow-right"></i> &nbsp;UNLOCK</button>
            <div class="error-msg" id="errorMsg"><i class="fas fa-circle-exclamation"></i> &nbsp;Invalid password</div>
        </div>

        <!-- ===== DASHBOARD ===== -->
        <div class="dashboard" id="dashboard">

            <!-- Top Bar -->
            <div class="top-bar">
                <div class="brand">BEAM <span>BOT</span></div>
                <div class="user-badge"><i class="fas fa-circle" style="color:#4ade80; font-size:0.5rem; margin-right:6px;"></i> authenticated</div>
            </div>

            <!-- Key Counts -->
            <div class="keys-grid" id="keyCounts">
                <!-- filled by JS -->
            </div>

            <!-- Key Lists -->
            <div class="key-list-section">
                <div class="section-title"><i class="fas fa-key"></i> &nbsp;1-Day Keys (20)</div>
                <div class="key-list" id="dayKeys"></div>
            </div>

            <div class="key-list-section">
                <div class="section-title"><i class="fas fa-key"></i> &nbsp;7-Day Keys (20)</div>
                <div class="key-list" id="weekKeys"></div>
            </div>

            <div class="key-list-section">
                <div class="section-title"><i class="fas fa-crown" style="color:#ffd700;"></i> &nbsp;Lifetime Keys (5)</div>
                <div class="key-list" id="lifetimeKeys"></div>
            </div>

            <!-- Text Box -->
            <div class="input-section">
                <span class="label"><i class="fas fa-pen"></i> &nbsp;input</span>
                <textarea placeholder="Type your message here..."></textarea>
            </div>

        </div>

    </div>

    <script>
        // ============================================================
        // CONFIG
        // ============================================================
        const PASSWORD = 'beam2026'; // <-- change this to your password

        // ============================================================
        // KEY GENERATORS
        // ============================================================
        function generateKey(prefix) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let key = prefix + '-';
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    key += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                if (i < 3) key += '-';
            }
            return key;
        }

        function generateKeys(count, prefix) {
            const keys = [];
            for (let i = 0; i < count; i++) {
                keys.push(generateKey(prefix));
            }
            return keys;
        }

        // Generate all keys
        const dayKeys = generateKeys(20, 'DAY');
        const weekKeys = generateKeys(20, 'WK');
        const lifetimeKeys = generateKeys(5, 'LIFE');

        // ============================================================
        // RENDER UI
        // ============================================================
        function renderDashboard() {
            // Counts
            document.getElementById('keyCounts').innerHTML = `
                <div class="key-card">
                    <div class="label">1-Day Keys</div>
                    <div class="count">${dayKeys.length}</div>
                    <div class="duration">valid 24 hours</div>
                </div>
                <div class="key-card">
                    <div class="label">7-Day Keys</div>
                    <div class="count">${weekKeys.length}</div>
                    <div class="duration">valid 7 days</div>
                </div>
                <div class="key-card lifetime">
                    <div class="label">Lifetime Keys</div>
                    <div class="count">${lifetimeKeys.length}</div>
                    <div class="duration">∞ unlimited</div>
                </div>
            `;

            // Day keys
            const dayContainer = document.getElementById('dayKeys');
            dayContainer.innerHTML = dayKeys.map(k => `<span class="key-tag">${k}</span>`).join('');

            // Week keys
            const weekContainer = document.getElementById('weekKeys');
            weekContainer.innerHTML = weekKeys.map(k => `<span class="key-tag">${k}</span>`).join('');

            // Lifetime keys
            const lifeContainer = document.getElementById('lifetimeKeys');
            lifeContainer.innerHTML = lifetimeKeys.map(k => `<span class="key-tag lifetime-key">${k}</span>`).join('');
        }

        // ============================================================
        // PASSWORD LOGIC
        // ============================================================
        const passwordScreen = document.getElementById('passwordScreen');
        const dashboard = document.getElementById('dashboard');
        const passwordInput = document.getElementById('passwordInput');
        const unlockBtn = document.getElementById('unlockBtn');
        const errorMsg = document.getElementById('errorMsg');

        function attemptUnlock() {
            const entered = passwordInput.value.trim();
            if (entered === PASSWORD) {
                passwordScreen.style.display = 'none';
                dashboard.style.display = 'block';
                renderDashboard();
                // Log all keys to console (for your reference)
                console.log('=== BEAM BOT KEYS ===');
                console.log('1-Day Keys:', dayKeys);
                console.log('7-Day Keys:', weekKeys);
                console.log('Lifetime Keys:', lifetimeKeys);
            } else {
                errorMsg.classList.add('show');
                passwordInput.value = '';
                passwordInput.focus();
                setTimeout(() => errorMsg.classList.remove('show'), 3000);
            }
        }

        unlockBtn.addEventListener('click', attemptUnlock);
        passwordInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') attemptUnlock();
        });

        // Focus on load
        window.addEventListener('load', () => {
            passwordInput.focus();
        });

        // ============================================================
        // PASTE KEYS (for you) - also visible in console
        // ============================================================
        console.log('\n=== PASTE THESE KEYS ===\n');
        console.log('--- 1-DAY KEYS (20) ---');
        dayKeys.forEach((k, i) => console.log(`${i+1}. ${k}`));
        console.log('\n--- 7-DAY KEYS (20) ---');
        weekKeys.forEach((k, i) => console.log(`${i+1}. ${k}`));
        console.log('\n--- LIFETIME KEYS (5) ---');
        lifetimeKeys.forEach((k, i) => console.log(`${i+1}. ${k}`));
    </script>

</body>
</html>
